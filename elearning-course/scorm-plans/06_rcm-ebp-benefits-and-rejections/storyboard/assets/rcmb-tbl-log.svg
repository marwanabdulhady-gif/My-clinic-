<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Rejection log table</title><desc id="desc">My Clinic course diagram. Text remains live SVG text where needed; decorative icon labels stay in HTML.</desc>
<rect width="1600" height="900" fill="#F4F7FA"/><style>text{font-family:Montserrat,Arial,sans-serif;fill:#003867}
.h{font-size:44px;font-weight:700}.b{font-size:27px;font-weight:500}
.small{font-size:22px;font-weight:600}
.line{stroke:#003867;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.thinline{stroke:#003867;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.card{fill:#fff;stroke:#D9E1E8;stroke-width:3}
.accent{fill:#008C99}
.purple{fill:#652D8C}
.magenta{fill:#9D3293}
.burg{fill:#7C0041}
</style><text x="80" y="95" class="h">Rejection log visual</text><text x="80" y="138" class="b">Fictional teaching rows only — claim ids are invented, names/dates omitted.</text><rect x="160" y="200" width="1280" height="460" rx="20" class="card"/><path d="M160 270h1280M160 610h1280" class="line"/><text x="210" y="248" class="small">Claim</text><text x="390" y="248" class="small">Date</text><text x="540" y="248" class="small">Payer</text><text x="700" y="248" class="small">Reason</text><text x="1130" y="248" class="small">Status</text><text x="210" y="310" class="b">CLM-0001</text><text x="390" y="310" class="b">—</text><text x="540" y="310" class="b">INS-01</text><text x="700" y="310" class="b">Missing auth</text><text x="1130" y="310" class="b">Denied</text><text x="210" y="352" class="b">CLM-0002</text><text x="390" y="352" class="b">—</text><text x="540" y="352" class="b">INS-02</text><text x="700" y="352" class="b">DX mismatch</text><text x="1130" y="352" class="b">Appealed</text><text x="210" y="394" class="b">CLM-0003</text><text x="390" y="394" class="b">—</text><text x="540" y="394" class="b">INS-03</text><text x="700" y="394" class="b">Eligibility</text><text x="1130" y="394" class="b">Corrected</text><text x="210" y="436" class="b">CLM-0004</text><text x="390" y="436" class="b">—</text><text x="540" y="436" class="b">INS-01</text><text x="700" y="436" class="b">Duplicate</text><text x="1130" y="436" class="b">Void</text><text x="210" y="478" class="b">CLM-0005</text><text x="390" y="478" class="b">—</text><text x="540" y="478" class="b">INS-04</text><text x="700" y="478" class="b">Modifier</text><text x="1130" y="478" class="b">Resubmitted</text><text x="210" y="520" class="b">CLM-0006</text><text x="390" y="520" class="b">—</text><text x="540" y="520" class="b">INS-02</text><text x="700" y="520" class="b">Timely filing</text><text x="1130" y="520" class="b">Denied</text><text x="210" y="562" class="b">CLM-0007</text><text x="390" y="562" class="b">—</text><text x="540" y="562" class="b">INS-03</text><text x="700" y="562" class="b">Documentation</text><text x="1130" y="562" class="b">Open</text><text x="210" y="604" class="b">CLM-0008</text><text x="390" y="604" class="b">—</text><text x="540" y="604" class="b">INS-01</text><text x="700" y="604" class="b">Benefit limit</text><text x="1130" y="604" class="b">Pending</text><text x="800" y="790" class="b" text-anchor="middle">Real names, dates, MRNs and providers are intentionally omitted.</text></svg>