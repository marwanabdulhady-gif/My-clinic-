<!doctype html><meta charset="utf-8"><title>Mock LMS</title>
<style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%}</style>
<script>
window.LOG=[];window.DATA={};
window.API={LMSInitialize:function(){LOG.push(['init']);return "true"},LMSFinish:function(){LOG.push(['finish']);return "true"},
LMSGetValue:function(k){return DATA[k]||""},LMSSetValue:function(k,v){DATA[k]=v;LOG.push(['set',k,v]);return "true"},
LMSCommit:function(){LOG.push(['commit']);return "true"},LMSGetLastError:function(){return "0"},LMSGetErrorString:function(){return ""},LMSGetDiagnostic:function(){return ""}};
</script>
<iframe id="f"></iframe>
<script>document.getElementById('f').src=decodeURIComponent(location.hash.slice(1));</script>
