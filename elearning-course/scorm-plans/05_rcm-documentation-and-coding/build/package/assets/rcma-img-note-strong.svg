<title id="title">Stronger fictional note</title><desc id="desc">My Clinic course diagram. Text remains live SVG text and can be recreated in HTML at build time.</desc>
<rect width="1600" height="900" fill="#F4F7FA"/><style>text{font-family:Montserrat,Arial,sans-serif;fill:#003867}.h{font-size:44px;font-weight:700}.b{font-size:27px;font-weight:500}.small{font-size:22px;font-weight:600}.line{stroke:#003867;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#D9E1E8;stroke-width:3}.accent{fill:#008C99}.magenta{fill:#9D3293}</style><text x="80" y="95" class="h">Stronger note — fictional example</text><rect x="260" y="165" width="1080" height="560" rx="24" class="card"/><rect x="300" y="215" width="300" height="36" rx="8" fill="#D9E1E8"/><text x="300" y="330" class="b">Dehydration signs: tachycardia and dry mucosa.</text><text x="300" y="385" class="b">Assessment: dehydration; IV fluids for stabilisation.</text><text x="300" y="440" class="b">Plan: reassess response and document follow-up.</text><rect x="300" y="530" width="700" height="70" rx="12" fill="#E4F3EC"/><text x="330" y="575" class="small">Findings + assessment + rationale + plan</text></svg>