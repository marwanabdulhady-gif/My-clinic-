<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
<title id="title">Employee benefits wheel</title>
<desc id="desc">Benefits wheel: health insurance, annual performance bonuses, employee development, hybrid work, internal advancement and discounts. Six segments with live SVG text labels so HR can correct the wording without redrawing the graphic.</desc>
<rect width="600" height="600" fill="#FFFFFF"/>
<style>
  text{font-family:Montserrat,Arial,sans-serif}
  .lab{font-size:21px;font-weight:700;fill:#FFFFFF}
  .lab2{font-size:17px;font-weight:500;fill:#FFFFFF;opacity:.9}
  .hub{font-size:19px;font-weight:700;fill:#003867}
  .small{font-size:16px;font-weight:600;fill:#5B6B7B}
  .seg{stroke:#FFFFFF;stroke-width:4}
  @media (prefers-reduced-motion: no-preference){
    .seg{transform-origin:300px 300px;animation:wheel-in 520ms cubic-bezier(.2,0,0,1) both}
    .s1{animation-delay:90ms}.s2{animation-delay:180ms}
    .s3{animation-delay:270ms}.s4{animation-delay:360ms}.s5{animation-delay:450ms}
    .lab,.lab2{animation:wheel-fade 300ms ease-out 520ms both}
  }
  @keyframes wheel-in{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
  @keyframes wheel-fade{from{opacity:0}to{opacity:1}}
</style>
<path class="seg s0" fill="#652D8C" d="M300 300 L300.0 90.0 A210 210 0 0 1 481.9 195.0 Z"/>
<path class="seg s1" fill="#008C99" d="M300 300 L481.9 195.0 A210 210 0 0 1 481.9 405.0 Z"/>
<path class="seg s2" fill="#9D3293" d="M300 300 L481.9 405.0 A210 210 0 0 1 300.0 510.0 Z"/>
<path class="seg s3" fill="#7C0041" d="M300 300 L300.0 510.0 A210 210 0 0 1 118.1 405.0 Z"/>
<path class="seg s4" fill="#006E78" d="M300 300 L118.1 405.0 A210 210 0 0 1 118.1 195.0 Z"/>
<path class="seg s5" fill="#946CAF" d="M300 300 L118.1 195.0 A210 210 0 0 1 300.0 90.0 Z"/>
<circle cx="300" cy="300" r="62" fill="#FFFFFF"/>
<text class="hub" x="300" y="296" text-anchor="middle">Your</text>
<text class="hub" x="300" y="320" text-anchor="middle">benefits</text>
<text class="lab" x="369.0" y="180.5" text-anchor="middle">Health</text>
<text class="lab2" x="369.0" y="204.5" text-anchor="middle">insurance</text>
<text class="lab" x="438.0" y="300.0" text-anchor="middle">Performance</text>
<text class="lab2" x="438.0" y="324.0" text-anchor="middle">bonus</text>
<text class="lab" x="369.0" y="419.5" text-anchor="middle">Development</text>
<text class="lab" x="231.0" y="419.5" text-anchor="middle">Hybrid</text>
<text class="lab2" x="231.0" y="443.5" text-anchor="middle">work</text>
<text class="lab" x="162.0" y="300.0" text-anchor="middle">Advancement</text>
<text class="lab2" x="162.0" y="324.0" text-anchor="middle">internal</text>
<text class="lab" x="231.0" y="180.5" text-anchor="middle">Discounts</text>
<text class="small" x="300" y="576" text-anchor="middle">Own SVG draft · labels are live text · benefit wording awaits HR approval</text>
</svg>
