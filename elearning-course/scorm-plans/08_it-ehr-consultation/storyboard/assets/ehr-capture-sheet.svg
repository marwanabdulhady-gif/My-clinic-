<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">EHR safe screenshot capture checklist</title><desc id="desc">My Clinic course diagram. Text remains live SVG text and can be recreated in HTML at build time.</desc>
<rect width="1600" height="900" fill="#F4F7FA"/><style>text{font-family:Montserrat,Arial,sans-serif;fill:#003867}.h{font-size:44px;font-weight:700}.b{font-size:27px;font-weight:500}.small{font-size:22px;font-weight:600}.line{stroke:#003867;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#D9E1E8;stroke-width:3}.accent{fill:#008C99}.magenta{fill:#9D3293}</style><text x="80" y="95" class="h">Safe EHR screenshot capture checklist</text><rect x="170" y="165" width="1260" height="575" rx="24" class="card"/><g class="small"><text x="300" y="285">1. Use the approved test environment and fictional test patient.</text><text x="300" y="385">2. Capture at 1920 × 1080 and 125% browser zoom.</text><text x="300" y="485">3. Check every field for names, phone numbers, MRNs and identifiers.</text><text x="300" y="585">4. Record EHR version and obtain DPO approval before upload.</text></g><g fill="#006E78"><circle cx="245" cy="275" r="20"/><circle cx="245" cy="375" r="20"/><circle cx="245" cy="475" r="20"/><circle cx="245" cy="575" r="20"/></g><g fill="#fff" font-family="Montserrat" font-size="22" font-weight="700"><text x="239" y="283">1</text><text x="239" y="383">2</text><text x="239" y="483">3</text><text x="239" y="583">4</text></g><text x="800" y="820" class="b" text-anchor="middle">This is a capture guide, not an EHR screen or a substitute for test-environment screenshots.</text></svg>