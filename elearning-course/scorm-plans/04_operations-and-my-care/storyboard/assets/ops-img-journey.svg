<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Patient journey</title><desc id="desc">My Clinic course diagram. Text remains live SVG text and can be recreated in HTML at build time.</desc>
<rect width="1600" height="900" fill="#F4F7FA"/><style>text{font-family:Montserrat,Arial,sans-serif;fill:#003867}.h{font-size:44px;font-weight:700}.b{font-size:27px;font-weight:500}.small{font-size:22px;font-weight:600}.line{stroke:#003867;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#D9E1E8;stroke-width:3}.accent{fill:#008C99}.magenta{fill:#9D3293}</style><text x="80" y="95" class="h">Patient journey</text><path class="line" d="M200 450h1160"/><path class="line" d="M1360 450l-32-25m32 25l-32 25"/><g><circle cx="220" cy="450" r="72" class="accent"/><circle cx="450" cy="450" r="72" fill="#9D3293"/><circle cx="680" cy="450" r="72" class="accent"/><circle cx="910" cy="450" r="72" fill="#9D3293"/><circle cx="1140" cy="450" r="72" class="accent"/><circle cx="1370" cy="450" r="72" fill="#9D3293"/></g><g class="small" text-anchor="middle" fill="#fff"><text x="220" y="460">BOOK</text><text x="450" y="460">ARRIVE</text><text x="680" y="460">CONSULT</text><text x="910" y="452">SERVICES</text><text x="910" y="480">&amp; PHARMACY</text><text x="1140" y="460">LEAVE</text><text x="1370" y="460">FOLLOW-UP</text></g><text x="800" y="700" class="b" text-anchor="middle">Operations and My Care meet the patient at different moments — both protect continuity.</text></svg>