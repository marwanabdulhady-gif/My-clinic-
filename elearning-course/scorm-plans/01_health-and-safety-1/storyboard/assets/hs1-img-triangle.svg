<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Fire triangle</title><desc id="desc">My Clinic course diagram. Text remains live SVG text and can be recreated in HTML at build time.</desc>
<rect width="1600" height="900" fill="#F4F7FA"/><style>text{font-family:Montserrat,Arial,sans-serif;fill:#003867}.h{font-size:44px;font-weight:700}.b{font-size:27px;font-weight:500}.small{font-size:22px;font-weight:600}.line{stroke:#003867;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#D9E1E8;stroke-width:3}.accent{fill:#008C99}.magenta{fill:#9D3293}</style><text x="80" y="95" class="h">The fire triangle</text><path d="M800 175L1220 720H380Z" fill="#fff" stroke="#003867" stroke-width="8"/><circle cx="800" cy="545" r="100" fill="#F4F7FA"/><text x="800" y="535" class="small" text-anchor="middle">REMOVE ONE</text><text x="800" y="568" class="small" text-anchor="middle">SIDE TO STOP FIRE</text><circle cx="800" cy="205" r="70" class="magenta"/><text x="800" y="215" class="small" text-anchor="middle" fill="#fff">HEAT</text><circle cx="1170" cy="690" r="70" class="accent"/><text x="1170" y="700" class="small" text-anchor="middle" fill="#fff">OXYGEN</text><circle cx="430" cy="690" r="70" fill="#7C0041"/><text x="430" y="700" class="small" text-anchor="middle" fill="#fff">FUEL</text></svg>