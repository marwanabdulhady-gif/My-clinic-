<title id="title">ALARA radiation protection</title><desc id="desc">My Clinic course diagram. Text remains live SVG text and can be recreated in HTML at build time.</desc>
<rect width="1600" height="900" fill="#F4F7FA"/><style>text{font-family:Montserrat,Arial,sans-serif;fill:#003867}.h{font-size:44px;font-weight:700}.b{font-size:27px;font-weight:500}.small{font-size:22px;font-weight:600}.line{stroke:#003867;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#D9E1E8;stroke-width:3}.accent{fill:#008C99}.magenta{fill:#9D3293}</style><text x="80" y="95" class="h">ALARA</text><text x="80" y="136" class="b">Keep exposure as low as reasonably achievable</text><circle cx="800" cy="455" r="112" fill="#9D3293"/><text x="800" y="446" class="small" text-anchor="middle" fill="#fff">RADIATION</text><text x="800" y="478" class="small" text-anchor="middle" fill="#fff">SOURCE</text><path class="line" d="M800 315V205M920 520l190 115M680 520L490 635"/><rect x="680" y="120" width="240" height="88" rx="20" class="card"/><rect x="1110" y="590" width="280" height="88" rx="20" class="card"/><rect x="210" y="590" width="280" height="88" rx="20" class="card"/><text x="800" y="175" class="small" text-anchor="middle">TIME · minimise it</text><text x="1250" y="645" class="small" text-anchor="middle">DISTANCE · increase it</text><text x="350" y="645" class="small" text-anchor="middle">SHIELDING · use it</text></svg>