<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">NFPA 704: four information areas</title><desc id="desc">NFPA 704 diamond with its standard layout: red flammability area at the top, blue health area on the left, yellow instability (reactivity) area on the right and white special-hazard area at the bottom. No ratings shown.</desc>
<rect width="1600" height="900" fill="#F4F7FA"/><style>text{font-family:Montserrat,Arial,sans-serif}.h{font-size:44px;font-weight:700;fill:#003867}.n{font-size:64px;font-weight:700}</style><text x="80" y="95" class="h">NFPA 704: four information areas</text><polygon points="800,170 950,320 800,470 650,320" fill="#D8262F"/><polygon points="650,320 800,470 650,620 500,470" fill="#1E5AA8"/><polygon points="950,320 1100,470 950,620 800,470" fill="#F0CF34"/><polygon points="800,470 950,620 800,770 650,620" fill="#FFFFFF" stroke="#003867" stroke-width="5"/><polygon points="800,170 1100,470 800,770 500,470" fill="none" stroke="#003867" stroke-width="6"/></svg>
